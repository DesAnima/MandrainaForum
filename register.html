<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Registro anónimo</title>
    <link rel="stylesheet" href="styles.css" />
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcode-generator/1.0.3/qrcode.min.js"></script>
    <style>
        #qr-box { display: none; text-align: center; margin-top: 1rem; }
        #qr-box svg { display: block; margin: 0 auto; width: min(240px, 100%); height: auto; aspect-ratio: 1 / 1; border-radius: 8px; }
        #qr-timer { color: #ffd900; font-weight: bold; margin-top: 0.5rem; }
        #qr-link { display:block; margin-top:0.5rem; font-size:0.85rem; word-break:break-all; color:#fff; }
        #form-error { color: #ff5c5c; min-height: 1.2rem; }
    </style>
</head>
<body>
    <div class="login-wrapper">
        <img src="images.jpg" alt="Imagen Registro" class="login-image" />
        <div class="login-container">
            <h2>Crear cuenta anónima</h2>
            <p style="color:#fff; font-size:0.9rem;">
                Elegí un nickname. No pedimos email ni ningún otro dato: vas a recibir
                una contraseña generada al azar escaneando un QR.
            </p>

            <form id="register-form">
                <input type="text" name="nickname" id="nickname" class="input-box" placeholder="Elegí un nickname" required minlength="3" maxlength="20" pattern="[A-Za-z0-9_]+" />
                <p id="form-error"></p>
                <button type="submit" class="btn btn-login" id="submit-btn">Generar mi QR</button>
            </form>

            <div id="qr-box">
                <p style="color:#fff;">Escaneá este código con tu celular:</p>
                <div id="qr-canvas"></div>
                <a id="qr-link" href="#" target="_blank" rel="noopener">Abrir el enlace directamente</a>
                <p id="qr-timer"></p>
            </div>

            <button type="button" class="btn btn-register" onclick="window.location.href='index.html'">
                Volver al login
            </button>
        </div>
    </div>

    <script>
        const form = document.getElementById('register-form');
        const errorEl = document.getElementById('form-error');
        const submitBtn = document.getElementById('submit-btn');
        const qrBox = document.getElementById('qr-box');
        const qrCanvas = document.getElementById('qr-canvas');
        const qrLink = document.getElementById('qr-link');
        const qrTimer = document.getElementById('qr-timer');

        let cuentaRegresiva = null;

        function iniciarCuentaRegresiva(segundos) {
            if (cuentaRegresiva) clearInterval(cuentaRegresiva);
            let restante = segundos;

            const render = () => {
                const m = Math.floor(restante / 60).toString().padStart(2, '0');
                const s = (restante % 60).toString().padStart(2, '0');
                qrTimer.textContent = restante > 0
                    ? `Este QR vence en ${m}:${s}`
                    : 'Este QR venció. Generá uno nuevo.';
            };

            render();
            cuentaRegresiva = setInterval(() => {
                restante--;
                render();
                if (restante <= 0) {
                    clearInterval(cuentaRegresiva);
                    qrBox.style.display = 'none';
                    form.style.display = '';
                }
            }, 1000);
        }

        form.addEventListener('submit', async (e) => {
            e.preventDefault();
            errorEl.textContent = '';
            submitBtn.disabled = true;

            const nickname = document.getElementById('nickname').value.trim();
            let data;

            try {
                const res = await fetch('register.php', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ nickname }),
                });
                data = await res.json();

                if (!res.ok) {
                    errorEl.textContent = data.error || 'No se pudo generar el registro.';
                    submitBtn.disabled = false;
                    return;
                }
            } catch (err) {
                console.error('Fallo al llamar a register.php:', err);
                errorEl.textContent = 'Error de red al contactar al servidor. Probá de nuevo.';
                submitBtn.disabled = false;
                return;
            }

            // A partir de acá el registro pendiente YA existe en el servidor,
            // así que mostramos el enlace siempre, pase lo que pase con la
            // imagen del QR.
            qrLink.href = data.claim_url;
            form.style.display = 'none';
            qrBox.style.display = 'block';
            iniciarCuentaRegresiva(data.expires_in);

            try {
                if (typeof qrcode === 'undefined') {
                    throw new Error('La librería del QR no cargó (revisá tu conexión a internet).');
                }

                // La auto-detección de tamaño (typeNumber 0) de esta librería
                // tiene un bug conocido con algunas longitudes de texto, así
                // que probamos tamaños crecientes hasta que uno funcione.
                let qr = null;
                for (let tipo = 1; tipo <= 40; tipo++) {
                    try {
                        const intento = qrcode(tipo, 'M');
                        intento.addData(data.claim_url);
                        intento.make();
                        qr = intento;
                        break;
                    } catch (_) {
                        qr = null;
                    }
                }

                if (!qr) {
                    throw new Error('No se pudo generar un QR para esta URL.');
                }

                // Dibujamos el SVG nosotros (con viewBox) en vez de usar
                // createSvgTag, que no trae viewBox y se deforma con CSS.
                const n = qr.getModuleCount();
                const margen = 4;
                const total = n + margen * 2;
                let celdas = '';
                for (let fila = 0; fila < n; fila++) {
                    for (let col = 0; col < n; col++) {
                        if (qr.isDark(fila, col)) {
                            celdas += `<rect x="${col + margen}" y="${fila + margen}" width="1" height="1"/>`;
                        }
                    }
                }
                qrCanvas.innerHTML =
                    `<svg xmlns="http://www.w3.org/2000/svg" width="240" height="240" viewBox="0 0 ${total} ${total}" shape-rendering="crispEdges">` +
                    `<rect width="${total}" height="${total}" fill="#fff"/>` +
                    `<g fill="#000">${celdas}</g></svg>`;
            } catch (err) {
                console.error('Fallo al generar la imagen del QR:', err);
                qrCanvas.innerHTML = '<p style="color:#ff5c5c; font-size:0.85rem;">No se pudo dibujar el QR. Usá el enlace de abajo.</p>';
            } finally {
                submitBtn.disabled = false;
            }
        });
    </script>
</body>
</html>
