<!DOCTYPE html>
<html lang="es">
<head>
    <script src="https://accounts.google.com/gsi/client" async defer></script>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Login</title>
    <link rel="stylesheet" href="styles.css" />

    <style>
        /* 🔧 Ajustes para mantener alineado el campo de contraseña */
        .password-container {
            position: relative;
            width: 80%;
            margin: 0.5rem auto;
        }

        .password-container input {
            width: 100%;
            box-sizing: border-box;
            padding-right: 4.5rem; /* espacio para el botón */
        }

        .toggle-password {
            position: absolute;
            top: 56%;
            right: 10px;
            transform: translateY(-50%);
            background: transparent;
            border: none;
            color: #ffd900;
            font-weight: bold;
            cursor: pointer;
            font-size: 0.9rem;
            transition: color 0.3s;
        }

        .toggle-password:hover {
            color: #fff;
        }
    </style>
</head>
<body>
    
    <div class="login-wrapper">
        <img src="images.jpg" alt="Imagen Login" class="login-image" />
        <div class="login-container">
            <h2>Ingresar</h2>

<form onsubmit="return validarFormulario()" method="POST" action="login.php">
    

    <div class="password-container">
        
        <input type="email" id="correo" name="email" class="input-box" placeholder="Correo Electrónico" required />
        <input type="password" id="password" name="password" class="input-box" placeholder="Contraseña" required />
        <button type="button" class="toggle-password" onclick="togglePassword()">Mostrar</button>
        <div id="g_id_onload"
     data-client_id="TU_CLIENT_ID_DE_GOOGLE"
     data-login_uri="https://tu-servidor.com/auth/google"
     data-auto_prompt="false">
</div>

<div class="g_id_signin"
     data-type="standard"
     data-shape="pill"
     data-theme="filled_black"
     data-text="signin_with"
     data-size="large"
     data-logo_alignment="left">
     
</div>
<div class="password-recovery">
  <a href="https://www.youtube.com/watch?v=xvFZjo5PgG0&list=RDxvFZjo5PgG0&start_radio=1" class="link-recover">¿Olvidaste tu contraseña?</a>
</div>
    </div>

    <button type="submit" class="btn btn-login">Login</button>
    
</form>

               <div class="password-container">
   
</div>



            <button class="btn btn-register" onclick="window.location.href='register.html'">
                Registrar
            </button>
            
      
        </div>
    </div>

    <script>
        // 🧠 Mostrar / ocultar la contraseña
        function togglePassword() {
            const passwordInput = document.getElementById("password");
            const toggleBtn = document.querySelector(".toggle-password");

            if (passwordInput.type === "password") {
                passwordInput.type = "text";
                toggleBtn.textContent = "Ocultar";
            } else {
                passwordInput.type = "password";
                toggleBtn.textContent = "Mostrar";
            }
            
        }


        function validarFormulario() {
            const correo = document.getElementById("correo");
            const password = document.getElementById("password");

            if (!correo.value.trim() || !password.value.trim()) {
                alert("Por favor, complete todos los campos antes de continuar.");
                return false;
            }
            return true;
        }
    </script>
</body>
</html>
