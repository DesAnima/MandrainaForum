<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Login</title>
    <link rel="stylesheet" href="styles.css" />

    <style>
        /* 🔧 Ajustes para mantener alineado el campo de contraseña */
        .password-container {
            position: relative;
            width: 80%;
            margin: 0.5rem auto;
        }

        .password-container input {
            width: 100%;
            box-sizing: border-box;
            padding-right: 4.5rem; /* espacio para el botón */
        }

        .toggle-password {
            position: absolute;
            top: 50%;
            right: 10px;
            transform: translateY(-50%);
            background: transparent;
            border: none;
            color: #ffd900;
            font-weight: bold;
            cursor: pointer;
            font-size: 0.9rem;
            transition: color 0.3s;
        }

        .toggle-password:hover {
            color: #fff;
        }
    </style>
</head>
<body>
    <div class="login-wrapper">
        <img src="images.jpg" alt="Imagen Login" class="login-image" />
        <div class="login-container">
            <h2>Ingresar</h2>

<form onsubmit="return validarFormulario()" method="POST" action="login.php">
    
    <input type="email" id="correo" name="email" class="input-box" placeholder="Correo Electrónico" required />

    <div class="password-container">
        <input type="password" id="password" name="password" class="input-box" placeholder="Contraseña" required />
        <button type="button" class="toggle-password" onclick="togglePassword()">Mostrar</button>
    </div>

    <button type="submit" class="btn btn-login">Login</button>
</form>

               <div class="password-container">
   
</div>



            <button class="btn btn-register" onclick="window.location.href='register.html'">
                Registrar
            </button>
        </div>
    </div>

    <script>
        // 🧠 Mostrar / ocultar la contraseña
        function togglePassword() {
            const passwordInput = document.getElementById("password");
            const toggleBtn = document.querySelector(".toggle-password");

            if (passwordInput.type === "password") {
                passwordInput.type = "text";
                toggleBtn.textContent = "Ocultar";
            } else {
                passwordInput.type = "password";
                toggleBtn.textContent = "Mostrar";
            }
        }

        // 🛡️ Validación básica del formulario
        function validarFormulario() {
            const correo = document.getElementById("correo");
            const password = document.getElementById("password");

            if (!correo.value.trim() || !password.value.trim()) {
                alert("Por favor, complete todos los campos antes de continuar.");
                return false;
            }
            return true;
        }
    </script>
</body>
</html>
