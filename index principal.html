<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Login</title>
    <!-- Enlace al archivo CSS externo -->
<link rel="stylesheet" href="styles.css" />

</head>
<body>
    <div class="login-wrapper">
        <img src="images.jpg" alt="Imagen Login" class="login-image" />
        <div class="login-container">
            <h2>Ingresar</h2>
            <input type="email" placeholder="Correo Electrónico" class="input-box" required />
            <input type="password" placeholder="Contraseña" class="input-box" required />
            <button class="btn btn-login">Login</button>
            <button class="btn btn-register">Registrar</button>
        </div>
    </div>
</body>
</html>
